<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Translator — Assinar Premium</title>
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    background: #0f0f14;
    color: #f4f4f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 380px; }
  .logo { font-size: 28px; margin-bottom: 8px; }
  h1 { font-size: 18px; margin: 0 0 20px; color: #a855f7; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,.15);
    border-top-color: #a855f7;
    border-radius: 50%;
    animation: girar .8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  #status { font-size: 14px; color: #a1a1aa; line-height: 1.5; }
  .erro { color: #f87171 !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">👻</div>
    <h1>Ghost Translator Premium</h1>
    <div class="spinner" id="spinner"></div>
    <p id="status">Abrindo o checkout...</p>
  </div>

  <script>
    // ⚙️ AMBIENTE ATUAL: ainda SANDBOX. Só troca pra "live" quando TODOS os
    // itens abaixo estiverem prontos (senão o checkout live vai falhar
    // pro cliente de verdade):
    //   1) domínio (gabryel-vitor.github.io) aparecer como "Approved"
    //      (não "Pending") em Checkout > Request domain approval, no
    //      painel LIVE (vendors.paddle.com, sem "sandbox-")
    //   2) conta tiver passado pela verificação de negócio da Paddle
    //   3) "Default payment link" e métodos de pagamento configurados
    //      no painel live
    //   4) dados bancários (Payout settings) preenchidos
    var AMBIENTE = "sandbox"; // troca pra "live" só depois dos 4 itens acima

    var CONFIG = {
      sandbox: {
        priceIdMensal: "pri_01m04273jpbxz0d20fcn3jtx9y",
        clientToken: "test_932d3f23b2a251ca9ace14b6c4d",
      },
      live: {
        priceIdMensal: "pri_01m00v70qz0ex19zbeny89s31t",
        clientToken: "live_44b9d93c42c66c7a511871d4730",
      },
    };

    var cfg = CONFIG[AMBIENTE];

    var params = new URLSearchParams(window.location.search);
    var userId = params.get("user_id");
    var email = params.get("email") || undefined;

    var statusEl = document.getElementById("status");
    var spinnerEl = document.getElementById("spinner");

    function mostrarErro(msg) {
      spinnerEl.style.display = "none";
      statusEl.textContent = msg;
      statusEl.className = "erro";
    }

    if (!userId) {
      mostrarErro("Link inválido: faltam informações da sua conta. Volte pra extensão Ghost Translator e tente de novo pelo botão \"Upgrade to Premium\".");
    } else {
      try {
        if (AMBIENTE === "sandbox") {
          Paddle.Environment.set("sandbox");
        }
        // Se AMBIENTE === "live", não chama Environment.set — live é o
        // padrão do Paddle.js quando nada é setado.

        Paddle.Initialize({ token: cfg.clientToken });

        Paddle.Checkout.open({
          items: [{ priceId: cfg.priceIdMensal, quantity: 1 }],
          // Isso é o que faz o webhook saber a qual usuário essa assinatura
          // pertence — a Paddle ecoa esse dado em todo evento futuro
          // relacionado a essa assinatura.
          customData: { user_id: userId },
          // Pré-preenche o campo de e-mail com o mesmo e-mail da conta
          // logada na extensão (só conveniência — quem identifica o
          // usuário de verdade é o customData acima, não isso).
          customer: email ? { email: email } : undefined,
          settings: {
            displayMode: "overlay",
            theme: "dark"
          },
          // Avisa quando o pagamento é concluído — fecha a aba sozinha
          // depois. A extensão já escuta quando essa aba fecha pra
          // atualizar o status pra Premium, então isso dá o efeito de
          // "voltar pra onde eu estava" sem precisar fazer nada manual.
          eventCallback: function (evento) {
            if (evento && evento.name === "checkout.completed") {
              spinnerEl.style.display = "none";
              statusEl.textContent = "✅ Pagamento confirmado! Fechando esta aba...";
              statusEl.className = "";
              setTimeout(function () {
                window.close();
                // Se chegou até aqui, o navegador bloqueou o fechamento
                // automático (acontece às vezes, depende de como a aba foi
                // aberta) — troca a mensagem pra instrução manual.
                setTimeout(function () {
                  statusEl.textContent = "✅ Pagamento confirmado! Pode fechar esta aba e voltar pra extensão.";
                }, 500);
              }, 2500);
            }
          }
        });

        statusEl.textContent = "Se o checkout não abrir sozinho, confira se o navegador não bloqueou um pop-up.";
      } catch (e) {
        mostrarErro("Não foi possível abrir o checkout: " + (e && e.message ? e.message : "erro desconhecido"));
      }
    }
  </script>
</body>
</html>
